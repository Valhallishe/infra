server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;
    set $mail_api http://server:8080;
    set $webmail http://webmail:8080;
    client_max_body_size 100m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    location = /login { proxy_pass $mail_api; }
    location = /api/auth { proxy_pass $mail_api; }
    location ^~ /api/discover/ { proxy_pass $mail_api; }
    location ^~ /auth/ { proxy_pass $mail_api; }
    location ^~ /.well-known/ { proxy_pass $mail_api; }
    location ^~ /jmap/ { proxy_pass $mail_api; }
    location ^~ /scim/ { proxy_pass $mail_api; }
    location = /_infra/theme.css {
        alias /etc/nginx/theme/inbuxa.css;
        default_type text/css;
    }
    location ~ ^/_infra/(?<brand_svg>brand-(?:light|dark)\.svg)$ {
        alias /etc/nginx/theme/brand/$brand_svg;
    }
    location = /favicon.ico {
        alias /etc/nginx/theme/brand/favicon.ico;
    }
    location = /img/inbuxa-mark.png {
        alias /etc/nginx/theme/brand/logo.png;
    }
    location ~ ^/img/(?<brand_image>logo\.png|favicon-64\.png|apple-touch-icon\.png|icon-(?:192|512|maskable)\.png)$ {
        alias /etc/nginx/theme/brand/$brand_image;
    }
    location ~ ^/_infra/build/[a-f0-9]+(?<build_asset>/assets/[^/]+)$ {
        proxy_pass $webmail$build_asset$is_args$args;
        include /etc/nginx/theme/*.conf;
    }
    location / {
        proxy_pass $webmail;
        include /etc/nginx/theme/*.conf;
    }
}
