server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;
    set $mail_api http://server:8080;
    set $webmail http://webmail:8080;
    client_max_body_size 100m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    location = /login { proxy_pass $mail_api; }
    location = /api/auth { proxy_pass $mail_api; }
    location ^~ /api/discover/ { proxy_pass $mail_api; }
    location ^~ /auth/ { proxy_pass $mail_api; }
    location ^~ /.well-known/ { proxy_pass $mail_api; }
    location ^~ /jmap/ { proxy_pass $mail_api; }
    location ^~ /scim/ { proxy_pass $mail_api; }
    location = /_infra/theme.css {
        alias /etc/nginx/theme/inbuxa.css;
        default_type text/css;
    }
    location / {
        proxy_pass $webmail;
        include /etc/nginx/theme/*.conf;
    }
}
